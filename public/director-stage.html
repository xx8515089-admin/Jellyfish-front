<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Director Stage</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #16181d; color: #d8dbe2; font: 13px/1.4 "PingFang SC","Microsoft YaHei",sans-serif; }
  #app { display: flex; width: 100%; height: 100%; flex-direction: column; }
  #toolbar { height: 46px; background: #1e2128; border-bottom: 1px solid #2c3038; display: flex; align-items: center; gap: 8px; padding: 0 12px; flex-shrink: 0; }
  #toolbar .sep { width: 1px; height: 24px; background: #343943; margin: 0 4px; }
  button, select, input[type=text], input[type=number] { background: #2a2e37; color: #d8dbe2; border: 1px solid #3a3f4a; border-radius: 6px; font-size: 12px; }
  button { padding: 6px 12px; cursor: pointer; }
  button:hover { background: #363c48; }
  button.primary, button.active { background: #3b6df0; border-color: #3b6df0; color: #fff; }
  select, input[type=text] { padding: 5px 8px; }
  input[type=range] { accent-color: #3b6df0; }
  label { color: #9aa0ac; font-size: 12px; }
  #main { flex: 1; min-height: 0; display: flex; }
  #leftPanel { width: 230px; background: #1e2128; border-right: 1px solid #2c3038; display: flex; flex-direction: column; flex-shrink: 0; }
  .panelTitle { padding: 10px 12px; font-weight: 600; color: #fff; border-bottom: 1px solid #2c3038; }
  #objectList { flex: 1; overflow-y: auto; padding: 6px; }
  .objItem { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer; user-select: none; }
  .objItem:hover { background: #272b34; }
  .objItem.selected { background: #2d3d6b; }
  .objItem .icon { width: 16px; text-align: center; }
  .objItem .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .objItem .ctrl { opacity: .45; padding: 0 2px; }
  .objItem .ctrl:hover { opacity: 1; }
  #groupBtns { padding: 8px; border-top: 1px solid #2c3038; display: flex; gap: 6px; }
  #groupBtns button { flex: 1; }
  #viewportWrap { flex: 1; min-width: 0; position: relative; }
  #viewport { width: 100%; height: 100%; display: block; }
  #viewBadge { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(20,22,28,.85); border: 1px solid #3a3f4a; border-radius: 20px; padding: 4px; display: flex; gap: 4px; }
  #viewBadge button { border: 0; border-radius: 16px; padding: 5px 16px; background: transparent; }
  #viewBadge button.active { background: #3b6df0; }
  #hint { position: absolute; bottom: 10px; left: 12px; color: #7d8492; font-size: 11px; background: rgba(20,22,28,.7); padding: 4px 10px; border-radius: 6px; pointer-events: none; }
  #pipLabel { position: absolute; pointer-events: none; color: #fff; font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 4px; display: none; }
  #rightPanel { width: 280px; background: #1e2128; border-left: 1px solid #2c3038; overflow-y: auto; flex-shrink: 0; }
  .section { border-bottom: 1px solid #2c3038; padding: 10px 12px; }
  .section h4 { color: #fff; font-size: 12px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row label { width: 64px; flex-shrink: 0; }
  .row input[type=number] { width: 60px; padding: 4px; }
  .row select { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .poseBtn { padding: 6px 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <strong style="color:#fff;">3D 导演台</strong>
    <div class="sep"></div>
    <button id="addMale">+ 男素模</button>
    <button id="addFemale">+ 女素模</button>
    <button id="addChild">+ 儿童</button>
    <button id="addCrowd">+ 群众阵列</button>
    <div class="sep"></div>
    <select id="primSelect">
      <option value="">+ 基础模型...</option>
      <option value="box">立方体</option>
      <option value="sphere">球体</option>
      <option value="cylinder">圆柱</option>
      <option value="wall">墙面</option>
      <option value="table">桌子</option>
    </select>
    <button id="uploadModelBtn">上传模型(.glb)</button>
    <button id="uploadPanoBtn">全景背景</button>
    <input type="file" id="glbInput" accept=".glb,.gltf" hidden>
    <input type="file" id="panoInput" accept="image/*" hidden>
    <div class="sep"></div>
    <button id="addCam">+ 新增机位</button>
    <select id="camSelect" title="当前机位"></select>
    <select id="ratioSelect" title="截图比例">
      <option value="16:9">16:9 横屏</option>
      <option value="9:16" selected>9:16 竖屏短剧</option>
      <option value="1:1">1:1</option>
      <option value="4:3">4:3</option>
      <option value="2.39:1">2.39:1 影院</option>
    </select>
    <div style="flex:1"></div>
    <button id="saveBtn">保存场景</button>
    <button id="loadBtn">载入场景</button>
    <input type="file" id="loadInput" accept=".json" hidden>
    <button id="captureBtn" class="primary">截图发布到 Jellyfish</button>
  </div>
  <div id="main">
    <div id="leftPanel">
      <div class="panelTitle">元素清单</div>
      <div id="objectList"></div>
      <div id="groupBtns">
        <button id="groupBtn">打组 (G)</button>
        <button id="ungroupBtn">解组</button>
        <button id="deleteBtn">删除</button>
      </div>
    </div>
    <div id="viewportWrap">
      <canvas id="viewport"></canvas>
      <div id="viewBadge">
        <button id="directorViewBtn" class="active">导演视角</button>
        <button id="shotViewBtn">机位视角</button>
      </div>
      <div id="hint">V 移动 | R 旋转 | S 缩放 | Shift+点击多选 | Del 删除 | 滚轮缩放 | 右键平移</div>
      <div id="pipLabel">机位预览</div>
    </div>
    <div id="rightPanel">
      <div class="section">
        <h4>场景</h4>
        <div class="row"><label>背景色</label><input type="color" id="bgColor" value="#3a3f4a"></div>
        <div class="row"><label>地面网格</label><input type="checkbox" id="gridToggle" checked></div>
        <div class="row"><label>截图含网格</label><input type="checkbox" id="captureGrid"></div>
        <div class="row"><button id="clearPano" style="flex:1">清除全景背景</button></div>
      </div>
      <div class="section" id="selSection" style="display:none">
        <h4 id="selTitle">选中对象</h4>
        <div class="row"><label>名称</label><input type="text" id="selName" style="flex:1"></div>
        <div class="row" id="colorRow"><label>颜色</label><input type="color" id="selColor"></div>
        <div class="row"><label>位置</label><input type="number" id="posX" step="0.1"><input type="number" id="posY" step="0.1"><input type="number" id="posZ" step="0.1"></div>
        <div class="row"><label>朝向 Y</label><input type="number" id="rotY" step="5"><button id="faceCamBtn" style="flex:1">面向机位</button></div>
      </div>
      <div class="section" id="poseSection" style="display:none">
        <h4>姿势预设</h4>
        <div class="grid2" id="poseBtns"></div>
      </div>
      <div class="section" id="camSection" style="display:none">
        <h4>摄像机</h4>
        <div class="row"><label>FOV</label><input type="range" id="fovRange" min="15" max="100" value="40" style="flex:1"><span id="fovVal">40</span></div>
        <div class="row"><button id="setCamHereBtn" style="flex:1">机位设为导演视角</button></div>
        <div class="row"><button id="lookAtSelBtn" style="flex:1">对准场景中心</button></div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const CONFIG = { autoDownload: false, postMessageTarget: '*' };
const RES = { '16:9':[1920,1080], '9:16':[1080,1920], '1:1':[1440,1440], '4:3':[1600,1200], '2.39:1':[2048,858] };
const $ = id => document.getElementById(id);

const canvas = $('viewport');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#3a3f4a');
const directorCam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
directorCam.position.set(6, 5, 8);
const orbit = new OrbitControls(directorCam, canvas);
orbit.target.set(0, 1, 0);
orbit.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a45, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
scene.add(sun);

const grid = new THREE.GridHelper(40, 40, 0x556080, 0x3a4050);
scene.add(grid);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const tControls = new TransformControls(directorCam, canvas);
tControls.addEventListener('dragging-changed', e => orbit.enabled = !e.value);
tControls.addEventListener('objectChange', () => syncPanelFromSelection());
scene.add(tControls);

let objects = [];
let selection = [];
let boxHelpers = [];
let idCounter = 1;
let shotCams = [];
let activeShot = null;
let viewMode = 'director';
let captureRenderer = null;
const raycaster = new THREE.Raycaster();

function register(obj, kind, name) {
  obj.userData.kind = kind;
  obj.userData.dsId = idCounter++;
  obj.name = name;
  scene.add(obj);
  objects.push(obj);
  refreshList();
  select(obj);
  return obj;
}
function unregister(obj) {
  if (obj.userData.kind === 'camera') removeShotCam(obj);
  scene.remove(obj);
  objects = objects.filter(o => o !== obj);
}
function limb(mat, r, len, y) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 12), mat);
  m.position.y = y;
  m.castShadow = true;
  return m;
}
function createMannequin(bodyType = 'male', color = 0x8fb4ff) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: .65 });
  const root = new THREE.Group();
  const J = {};
  const hips = new THREE.Group();
  hips.position.y = 0.95;
  root.add(hips);
  hips.add(limb(mat, .13, .1, 0));
  const spine = J.spine = new THREE.Group();
  spine.position.y = .08;
  hips.add(spine);
  spine.add(limb(mat, .125, .3, .24));
  const neck = J.neck = new THREE.Group();
  neck.position.y = .44;
  spine.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.11, 20, 16), mat);
  head.position.y = .14;
  head.castShadow = true;
  neck.add(head);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(.025, .07, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  nose.position.set(0, .14, .11);
  nose.rotation.x = Math.PI / 2;
  neck.add(nose);
  for (const side of ['L', 'R']) {
    const sx = side === 'L' ? 1 : -1;
    const sh = J['shoulder' + side] = new THREE.Group();
    sh.position.set(.21 * sx, .38, 0);
    spine.add(sh);
    sh.add(limb(mat, .045, .2, -.15));
    const el = J['elbow' + side] = new THREE.Group();
    el.position.y = -.3;
    sh.add(el);
    el.add(limb(mat, .04, .18, -.13));
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 10), mat);
    hand.position.y = -.27;
    hand.castShadow = true;
    el.add(hand);
    const hp = J['hip' + side] = new THREE.Group();
    hp.position.set(.09 * sx, -.04, 0);
    hips.add(hp);
    hp.add(limb(mat, .065, .28, -.2));
    const kn = J['knee' + side] = new THREE.Group();
    kn.position.y = -.42;
    hp.add(kn);
    kn.add(limb(mat, .055, .28, -.19));
    const foot = new THREE.Mesh(new THREE.BoxGeometry(.09, .06, .22), mat);
    foot.position.set(0, -.4, .05);
    foot.castShadow = true;
    kn.add(foot);
  }
  const scales = { male:[1,1,1], female:[.93,.97,.93], child:[.65,.62,.65], heavy:[1.18,1.02,1.18] };
  root.scale.set(...(scales[bodyType] || scales.male));
  root.userData.joints = J;
  root.userData.material = mat;
  root.userData.bodyType = bodyType;
  applyPose(root, '站立');
  return root;
}
const POSES = {
  '站立': { elbowL:{x:-8}, elbowR:{x:-8} },
  '行走': { shoulderL:{x:28}, shoulderR:{x:-28}, elbowL:{x:-15}, elbowR:{x:-35}, hipL:{x:-28}, hipR:{x:22}, kneeR:{x:38} },
  '跑步': { spine:{x:12}, shoulderL:{x:55}, shoulderR:{x:-55}, elbowL:{x:-90}, elbowR:{x:-90}, hipL:{x:-55}, hipR:{x:35}, kneeL:{x:25}, kneeR:{x:85} },
  '坐姿': { hipL:{x:-88}, hipR:{x:-88}, kneeL:{x:85}, kneeR:{x:85}, elbowL:{x:-20}, elbowR:{x:-20} },
  '蹲下': { spine:{x:25}, hipL:{x:-105}, hipR:{x:-105}, kneeL:{x:115}, kneeR:{x:115}, shoulderL:{x:-35}, shoulderR:{x:-35}, elbowL:{x:-50}, elbowR:{x:-50} },
  '举手': { shoulderR:{x:-165}, elbowR:{x:-10} },
  '指向前方': { shoulderR:{x:-85} },
  '对峙': { spine:{x:8, y:15}, shoulderL:{x:-55}, shoulderR:{x:-70}, elbowL:{x:-95}, elbowR:{x:-95}, hipL:{x:-18}, kneeL:{x:25}, hipR:{x:8}, kneeR:{x:15} },
  'T-Pose': { shoulderL:{z:80}, shoulderR:{z:-80} },
};
function applyPose(root, poseName) {
  const J = root.userData.joints;
  if (!J) return;
  for (const j of Object.values(J)) j.rotation.set(0, 0, 0);
  for (const [jn, rot] of Object.entries(POSES[poseName] || {})) {
    const j = J[jn];
    if (!j) continue;
    j.rotation.set(THREE.MathUtils.degToRad(rot.x || 0), THREE.MathUtils.degToRad(rot.y || 0), THREE.MathUtils.degToRad(rot.z || 0));
  }
  root.userData.pose = poseName;
}
const PRIMS = {
  box: () => new THREE.BoxGeometry(1,1,1),
  sphere: () => new THREE.SphereGeometry(.5,24,18),
  cylinder: () => new THREE.CylinderGeometry(.5,.5,1,24),
  wall: () => new THREE.BoxGeometry(4,2.6,.12),
  table: () => new THREE.BoxGeometry(1.6,.08,.8),
};
function createPrim(type) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x9aa0ac, roughness:.8 });
  const m = new THREE.Mesh(PRIMS[type](), mat);
  m.castShadow = m.receiveShadow = true;
  m.userData.material = mat;
  m.position.y = { box:.5, sphere:.5, cylinder:.5, wall:1.3, table:.75 }[type];
  if (type === 'table') {
    for (const [x,z] of [[-.72,-.32],[.72,-.32],[-.72,.32],[.72,.32]]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(.06,.72,.06), mat);
      leg.position.set(x,-.4,z);
      leg.castShadow = true;
      m.add(leg);
    }
  }
  return m;
}
function createCrowd(rows, cols, spacing) {
  const g = new THREE.Group();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const p = createMannequin('male', 0x7d8492);
    p.position.set((c - (cols - 1) / 2) * spacing, 0, (r - (rows - 1) / 2) * spacing);
    g.add(p);
  }
  g.userData.crowd = { rows, cols, spacing };
  return g;
}
function createShotCam(name) {
  const rig = new THREE.Group();
  const cam = new THREE.PerspectiveCamera(40, 16/9, .1, 300);
  rig.add(cam);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf2b441 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(.34,.24,.44), bodyMat);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,.22,16), bodyMat);
  lens.rotation.x = Math.PI / 2;
  lens.position.z = -.3;
  rig.add(body, lens);
  rig.position.copy(directorCam.position);
  rig.quaternion.copy(directorCam.quaternion);
  const helper = new THREE.CameraHelper(cam);
  scene.add(helper);
  rig.userData.cam = cam;
  rig.userData.helper = helper;
  shotCams.push(rig);
  register(rig, 'camera', name);
  setActiveShot(rig);
  refreshCamSelect();
  return rig;
}
function removeShotCam(rig) {
  scene.remove(rig.userData.helper);
  shotCams = shotCams.filter(c => c !== rig);
  if (activeShot === rig) activeShot = shotCams[0] || null;
  refreshCamSelect();
}
function setActiveShot(rig) {
  activeShot = rig;
  refreshCamSelect();
}
function refreshCamSelect() {
  const sel = $('camSelect');
  sel.innerHTML = '';
  shotCams.forEach(c => {
    const o = document.createElement('option');
    o.value = c.userData.dsId;
    o.textContent = c.name;
    if (c === activeShot) o.selected = true;
    sel.appendChild(o);
  });
}
function rootOf(o) {
  while (o && o.parent !== scene) o = o.parent;
  return objects.includes(o) ? o : null;
}
function select(obj, additive = false) {
  if (!additive) selection = [];
  if (obj) {
    selection = selection.filter(s => s !== obj);
    selection.push(obj);
  }
  boxHelpers.forEach(h => scene.remove(h));
  boxHelpers = [];
  selection.forEach(s => {
    const h = new THREE.BoxHelper(s, 0x3b6df0);
    scene.add(h);
    boxHelpers.push(h);
  });
  const primary = selection[selection.length - 1] || null;
  primary ? tControls.attach(primary) : tControls.detach();
  refreshList();
  syncPanelFromSelection();
}
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || tControls.dragging || viewMode !== 'director') return;
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), directorCam);
  const hits = raycaster.intersectObjects(objects, true).map(h => rootOf(h.object)).filter(Boolean);
  if (hits.length) select(hits[0], e.shiftKey);
  else if (!e.shiftKey) select(null);
});
const ICONS = { mannequin:'人', prim:'■', crowd:'群', camera:'机', model:'模', group:'组' };
function refreshList() {
  const list = $('objectList');
  list.innerHTML = '';
  objects.forEach(o => {
    const div = document.createElement('div');
    div.className = 'objItem' + (selection.includes(o) ? ' selected' : '');
    div.innerHTML = `<span class="icon">${ICONS[o.userData.kind] || '■'}</span><span class="name">${o.name}</span><span class="ctrl eye">${o.visible ? '显示' : '隐藏'}</span>`;
    div.onclick = e => {
      if (e.target.classList.contains('eye')) {
        o.visible = !o.visible;
        refreshList();
        return;
      }
      select(o, e.shiftKey);
    };
    div.ondblclick = () => {
      const n = prompt('重命名', o.name);
      if (n) {
        o.name = n;
        refreshList();
        refreshCamSelect();
      }
    };
    list.appendChild(div);
  });
}
function syncPanelFromSelection() {
  const o = selection[selection.length - 1];
  $('selSection').style.display = o ? '' : 'none';
  $('poseSection').style.display = (o && o.userData.kind === 'mannequin') ? '' : 'none';
  $('camSection').style.display = (o && o.userData.kind === 'camera') ? '' : 'none';
  if (!o) return;
  $('selTitle').textContent = `选中：${o.name}`;
  $('selName').value = o.name;
  $('colorRow').style.display = o.userData.material ? '' : 'none';
  if (o.userData.material) $('selColor').value = '#' + o.userData.material.color.getHexString();
  $('posX').value = o.position.x.toFixed(2);
  $('posY').value = o.position.y.toFixed(2);
  $('posZ').value = o.position.z.toFixed(2);
  $('rotY').value = THREE.MathUtils.radToDeg(o.rotation.y).toFixed(0);
  if (o.userData.kind === 'camera') {
    $('fovRange').value = o.userData.cam.fov;
    $('fovVal').textContent = o.userData.cam.fov.toFixed(0);
  }
}
$('selName').onchange = e => {
  const o = selection.at(-1);
  if (o) {
    o.name = e.target.value;
    refreshList();
    refreshCamSelect();
  }
};
$('selColor').oninput = e => selection.at(-1)?.userData.material?.color.set(e.target.value);
['posX','posY','posZ'].forEach((id, i) => $(id).onchange = e => {
  const o = selection.at(-1);
  if (o) o.position.setComponent(i, parseFloat(e.target.value) || 0);
});
$('rotY').onchange = e => {
  const o = selection.at(-1);
  if (o) o.rotation.y = THREE.MathUtils.degToRad(parseFloat(e.target.value) || 0);
};
$('faceCamBtn').onclick = () => {
  const o = selection.at(-1);
  if (!o || !activeShot) return;
  const p = activeShot.position.clone();
  p.y = o.position.y;
  o.lookAt(p);
};
Object.keys(POSES).forEach(p => {
  const b = document.createElement('button');
  b.className = 'poseBtn';
  b.textContent = p;
  b.onclick = () => {
    const o = selection.at(-1);
    if (o?.userData.joints) applyPose(o, p);
  };
  $('poseBtns').appendChild(b);
});
$('fovRange').oninput = e => {
  const o = selection.at(-1);
  if (o?.userData.cam) {
    o.userData.cam.fov = +e.target.value;
    o.userData.cam.updateProjectionMatrix();
    $('fovVal').textContent = e.target.value;
  }
};
$('setCamHereBtn').onclick = () => {
  const o = selection.at(-1);
  if (o?.userData.cam) {
    o.position.copy(directorCam.position);
    o.quaternion.copy(directorCam.quaternion);
  }
};
$('lookAtSelBtn').onclick = () => selection.at(-1)?.lookAt(0, 1, 0);
$('bgColor').oninput = e => scene.background = new THREE.Color(e.target.value);
$('gridToggle').onchange = e => grid.visible = e.target.checked;
$('clearPano').onclick = () => scene.background = new THREE.Color($('bgColor').value);
$('uploadModelBtn').onclick = () => $('glbInput').click();
$('uploadPanoBtn').onclick = () => $('panoInput').click();
$('addMale').onclick = () => register(createMannequin('male', 0x8fb4ff), 'mannequin', `男素模 ${idCounter}`);
$('addFemale').onclick = () => register(createMannequin('female', 0xff9fc0), 'mannequin', `女素模 ${idCounter}`);
$('addChild').onclick = () => register(createMannequin('child', 0xa0e8a0), 'mannequin', `儿童 ${idCounter}`);
$('addCrowd').onclick = () => {
  const rows = +prompt('行数', 3) || 3;
  const cols = +prompt('列数', 4) || 4;
  const sp = +prompt('间距(米)', 1.2) || 1.2;
  register(createCrowd(rows, cols, sp), 'crowd', `群众阵列 ${rows}x${cols}`);
};
$('primSelect').onchange = e => {
  if (e.target.value) register(createPrim(e.target.value), 'prim', `${e.target.options[e.target.selectedIndex].text} ${idCounter}`);
  e.target.value = '';
};
$('addCam').onclick = () => createShotCam(`机位 ${shotCams.length + 1}`);
$('camSelect').onchange = e => {
  const rig = shotCams.find(c => c.userData.dsId == e.target.value);
  if (rig) setActiveShot(rig);
};
$('glbInput').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  new GLTFLoader().parse(buf, '', gltf => {
    const m = gltf.scene;
    m.traverse(c => {
      if (c.isMesh) c.castShadow = c.receiveShadow = true;
    });
    register(m, 'model', f.name.replace(/\.(glb|gltf)$/i, ''));
  });
  e.target.value = '';
};
$('panoInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  new THREE.TextureLoader().load(URL.createObjectURL(f), tex => {
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    scene.background = tex;
  });
  e.target.value = '';
};
function doGroup() {
  if (selection.length < 2) return;
  const g = new THREE.Group();
  scene.add(g);
  [...selection].forEach(o => {
    objects = objects.filter(x => x !== o);
    g.attach(o);
  });
  selection = [];
  register(g, 'group', `组 ${idCounter}`);
}
$('groupBtn').onclick = doGroup;
$('ungroupBtn').onclick = () => {
  const g = selection.at(-1);
  if (!g || g.userData.kind !== 'group') return;
  [...g.children].forEach(c => {
    scene.attach(c);
    if (c.userData.kind) objects.push(c);
  });
  unregister(g);
  select(null);
};
function doDelete() {
  [...selection].forEach(unregister);
  select(null);
  refreshList();
}
$('deleteBtn').onclick = doDelete;
window.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key.toLowerCase() === 'v') tControls.setMode('translate');
  if (e.key.toLowerCase() === 'r') tControls.setMode('rotate');
  if (e.key.toLowerCase() === 's') tControls.setMode('scale');
  if (e.key.toLowerCase() === 'g') doGroup();
  if (e.key === 'Delete' || e.key === 'Backspace') doDelete();
});
$('directorViewBtn').onclick = () => setViewMode('director');
$('shotViewBtn').onclick = () => setViewMode('shot');
function setViewMode(m) {
  viewMode = m;
  $('directorViewBtn').classList.toggle('active', m === 'director');
  $('shotViewBtn').classList.toggle('active', m === 'shot');
  orbit.enabled = m === 'director';
  tControls.visible = tControls.enabled = m === 'director';
}
async function captureShot() {
  if (!activeShot) {
    alert('请先新增一个机位');
    return;
  }
  if (!captureRenderer) {
    captureRenderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
    captureRenderer.shadowMap.enabled = true;
    captureRenderer.outputColorSpace = THREE.SRGBColorSpace;
  }
  const ratio = $('ratioSelect').value;
  const [w, h] = RES[ratio];
  const cam = activeShot.userData.cam;
  const hidden = [];
  const hide = o => {
    if (o.visible) {
      o.visible = false;
      hidden.push(o);
    }
  };
  if (tControls.visible) hide(tControls);
  boxHelpers.forEach(hide);
  shotCams.forEach(c => {
    hide(c.userData.helper);
    c.children.forEach(ch => !ch.isCamera && hide(ch));
  });
  if (!$('captureGrid').checked) hide(grid);
  captureRenderer.setSize(w, h, false);
  const oldAspect = cam.aspect;
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
  captureRenderer.render(scene, cam);
  const dataURL = captureRenderer.domElement.toDataURL('image/png');
  cam.aspect = oldAspect;
  cam.updateProjectionMatrix();
  hidden.forEach(o => o.visible = true);
  const meta = { camera: activeShot.name, fov: cam.fov, ratio, width: w, height: h, timestamp: Date.now(), sceneJSON: serializeScene() };
  deliver(dataURL, meta);
}
$('captureBtn').onclick = captureShot;
function deliver(dataURL, meta) {
  if (CONFIG.autoDownload) {
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = `director_stage_${meta.camera}_${meta.ratio.replace(':','x')}.png`;
    a.click();
  }
  window.parent.postMessage({ type: 'director-stage:capture', dataURL, meta }, CONFIG.postMessageTarget);
}
function serializeScene() {
  return {
    version: 1,
    background: scene.background.isColor ? '#' + scene.background.getHexString() : null,
    objects: objects.map(o => ({
      kind: o.userData.kind,
      name: o.name,
      position: o.position.toArray(),
      rotation: o.rotation.toArray().slice(0, 3),
      scale: o.scale.toArray(),
      color: o.userData.material ? '#' + o.userData.material.color.getHexString() : null,
      bodyType: o.userData.bodyType || null,
      pose: o.userData.pose || null,
      crowd: o.userData.crowd || null,
      fov: o.userData.cam ? o.userData.cam.fov : null,
      visible: o.visible,
    })),
    activeCam: activeShot ? activeShot.name : null,
  };
}
function restoreScene(data) {
  [...objects].forEach(unregister);
  selection = [];
  shotCams = [];
  activeShot = null;
  if (data.background) scene.background = new THREE.Color(data.background);
  for (const d of data.objects || []) {
    let o = null;
    if (d.kind === 'mannequin') {
      o = createMannequin(d.bodyType, d.color);
      if (d.pose) applyPose(o, d.pose);
    } else if (d.kind === 'crowd' && d.crowd) {
      o = createCrowd(d.crowd.rows, d.crowd.cols, d.crowd.spacing);
    } else if (d.kind === 'camera') {
      o = createShotCam(d.name);
    } else {
      o = createPrim('box');
      if (d.color) o.userData.material.color.set(d.color);
    }
    if (!o) continue;
    o.position.fromArray(d.position);
    o.rotation.fromArray([...d.rotation, 'XYZ']);
    o.scale.fromArray(d.scale);
    o.visible = d.visible;
    if (d.fov && o.userData.cam) {
      o.userData.cam.fov = d.fov;
      o.userData.cam.updateProjectionMatrix();
    }
    if (d.kind !== 'camera') register(o, d.kind, d.name);
  }
  select(null);
}
$('saveBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(serializeScene(), null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'director_stage_scene.json';
  a.click();
};
$('loadBtn').onclick = () => $('loadInput').click();
$('loadInput').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  restoreScene(JSON.parse(await f.text()));
  e.target.value = '';
};
window.DirectorStage = { capture: captureShot, getScene: serializeScene, loadScene: restoreScene, addMannequin: (type, color) => register(createMannequin(type, color), 'mannequin', `素模 ${idCounter}`), config: CONFIG };
window.addEventListener('message', e => {
  if (e.data?.type === 'director-stage:request-capture') captureShot();
  if (e.data?.type === 'director-stage:load-scene') restoreScene(e.data.scene);
});
function getRatio() {
  const [a, b] = $('ratioSelect').value.split(':').map(Number);
  return a / b;
}
function animate() {
  requestAnimationFrame(animate);
  const wrap = $('viewportWrap');
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  if (canvas.width !== W * devicePixelRatio || canvas.height !== H * devicePixelRatio) {
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(W, H, false);
  }
  boxHelpers.forEach(h => h.update());
  shotCams.forEach(c => {
    c.userData.helper.update();
    c.userData.helper.visible = viewMode === 'director';
  });
  renderer.setScissorTest(false);
  if (viewMode === 'director') {
    directorCam.aspect = W / H;
    directorCam.updateProjectionMatrix();
    renderer.setViewport(0, 0, W, H);
    renderer.render(scene, directorCam);
    if (activeShot) {
      const ar = getRatio();
      const pw = Math.min(300, W * .28);
      const ph = pw / ar;
      const px = W - pw - 14;
      const py = 14;
      const cam = activeShot.userData.cam;
      cam.aspect = ar;
      cam.updateProjectionMatrix();
      const helperVis = shotCams.map(c => c.userData.helper.visible);
      shotCams.forEach(c => c.userData.helper.visible = false);
      const tVis = tControls.visible;
      tControls.visible = false;
      renderer.setScissorTest(true);
      renderer.setScissor(px, py, pw, ph);
      renderer.setViewport(px, py, pw, ph);
      renderer.render(scene, cam);
      renderer.setScissorTest(false);
      tControls.visible = tVis;
      shotCams.forEach((c, i) => c.userData.helper.visible = helperVis[i]);
      const lbl = $('pipLabel');
      lbl.style.display = 'block';
      lbl.style.right = '20px';
      lbl.style.left = 'auto';
      lbl.style.bottom = (ph + 18) + 'px';
      lbl.style.top = 'auto';
      lbl.textContent = `${activeShot.name} 预览 (${ $('ratioSelect').value })`;
    } else {
      $('pipLabel').style.display = 'none';
    }
  } else {
    $('pipLabel').style.display = 'none';
    renderer.setViewport(0, 0, W, H);
    renderer.setClearColor(0x000000);
    renderer.clear();
    if (activeShot) {
      const ar = getRatio();
      let vw = W;
      let vh = W / ar;
      if (vh > H) {
        vh = H;
        vw = H * ar;
      }
      const vx = (W - vw) / 2;
      const vy = (H - vh) / 2;
      const cam = activeShot.userData.cam;
      cam.aspect = ar;
      cam.updateProjectionMatrix();
      const helperVis = shotCams.map(c => c.userData.helper.visible);
      shotCams.forEach(c => c.userData.helper.visible = false);
      renderer.setScissorTest(true);
      renderer.setScissor(vx, vy, vw, vh);
      renderer.setViewport(vx, vy, vw, vh);
      renderer.render(scene, cam);
      renderer.setScissorTest(false);
      shotCams.forEach((c, i) => c.userData.helper.visible = helperVis[i]);
    }
  }
}
createShotCam('机位 1');
activeShot.position.set(0, 1.5, 4.5);
activeShot.lookAt(0, 1, 0);
register(createMannequin('male', 0x8fb4ff), 'mannequin', '男主');
objects.at(-1).position.x = -0.7;
register(createMannequin('female', 0xff9fc0), 'mannequin', '女主');
const fem = objects.at(-1);
fem.position.set(0.7, 0, 0.4);
fem.rotation.y = -0.5;
select(null);
animate();
</script>
